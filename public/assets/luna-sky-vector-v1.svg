<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 720" role="img" aria-labelledby="title description">
  <title id="title">Luna, the Fraud Bloom assistant</title>
  <desc id="description">A white cat with a blue bow and navy hoodie, surrounded by blue and pink sparkles.</desc>
  <defs>
    <radialGradient id="fur" cx="45%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".72" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dcecff"/>
    </radialGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102f69"/>
      <stop offset=".55" stop-color="#071b45"/>
      <stop offset="1" stop-color="#020c27"/>
    </linearGradient>
    <linearGradient id="trim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74e8ff"/>
      <stop offset=".48" stop-color="#178dff"/>
      <stop offset="1" stop-color="#6a45ff"/>
    </linearGradient>
    <radialGradient id="iris" cx="38%" cy="28%" r="70%">
      <stop offset="0" stop-color="#d8fbff"/>
      <stop offset=".28" stop-color="#54d9ff"/>
      <stop offset=".68" stop-color="#167ce7"/>
      <stop offset="1" stop-color="#06265f"/>
    </radialGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb7e7"/>
      <stop offset=".5" stop-color="#ff69bc"/>
      <stop offset="1" stop-color="#d62f9b"/>
    </linearGradient>
    <filter id="blueGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#01051a" flood-opacity=".65"/>
    </filter>
  </defs>

